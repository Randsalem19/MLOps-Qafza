name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/inference_service --cov-report=term-missing

      # A failing test or lint step above stops the pipeline here —
      # the build/push job below only runs if this job succeeds.

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: order-delivery-inference:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # To actually push to a registry, add a docker/login-action step with
      # registry credentials in repo secrets, then set push: true above and
      # tag with your registry, e.g. ghcr.io/<owner>/order-delivery-inference.
